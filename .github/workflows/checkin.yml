name: Scheduled Check-In Bot

permissions:
  contents: write

on:
  schedule:
    - cron: "0 10 * * *"   # runs daily at 10:00 UTC
    - cron: "0 18 * * *"   # runs again at 18:00 UTC
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      PRACTICE_API_TOKEN: ${{ secrets.PRACTICE_API_TOKEN }}
      PRACTICE_API_URL: ${{ secrets.PRACTICE_API_URL }}
      INSTRUCTOR_ID: ${{ vars.INSTRUCTOR_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        run: python automated_bot.py

      - name: Commit artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifact/
          git commit -m "Update artifact"
          git push
